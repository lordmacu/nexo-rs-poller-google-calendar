# Phase 96 — standalone subprocess plugin for Google Calendar v3
# incremental sync. Extracted from `crates/poller/src/builtins/google_calendar.rs`
# during the Phase 96 Laravel-style poller refactor.

[package]
name         = "nexo-poller-google-calendar"
version      = "0.1.0"
description  = "Google Calendar v3 poller plugin for Nexo agents (out-of-tree subprocess)."
edition      = "2021"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/lordmacu/nexo-rs-poller-google-calendar"
authors      = ["Cristian García <informacion@cristiangarcia.co>"]
readme       = "README.md"
keywords     = ["nexo", "plugin", "google", "calendar", "poller"]
categories   = ["api-bindings"]
rust-version = "1.80"

[lib]
name = "nexo_poller_google_calendar"
path = "src/lib.rs"

[[bin]]
name = "nexo-poller-google-calendar"
path = "src/main.rs"

[dependencies]
nexo-microapp-sdk = { path = "../proyecto/crates/microapp-sdk", features = ["plugin", "poller"] }
nexo-poller       = { path = "../proyecto/crates/poller" }
nexo-broker       = { path = "../proyecto/crates/broker" }
nexo-config       = { path = "../proyecto/crates/config" }
# OAuth + Calendar API client. Same lib the in-tree poller used
# before Phase 96 extraction. The plugin runs the OAuth refresh
# itself (subprocess holds the token file via fcntl lock) using the
# paths the daemon hands over through `host.credentials_get`.
nexo-plugin-google = "0.3.0"

tokio        = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "io-std"] }
async-trait  = "0.1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"
anyhow       = "1"
chrono       = { version = "0.4", features = ["serde"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile     = "3"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
